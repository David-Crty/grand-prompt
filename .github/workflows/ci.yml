name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests with coverage (>= 90% enforced)
        run: pnpm coverage
      - name: Determinism (two processes, same hashes)
        run: pnpm determinism
      - name: Viewer build
        run: pnpm --filter @bench/viewer build

  # The infrastructure (Pages project, domain, this environment) is in David-Crty/infra, terraform/llm-racing.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://llm-racing.crty.dev
    concurrency:
      group: deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Races (results are a pure function of the committed drivers, so they are rebuilt, not stored)
        run: |
          for f in drivers/*/event.json; do
            pnpm bench race "$(basename "$(dirname "$f")")"
          done
      - run: pnpm --filter @bench/viewer build
      - run: pnpm exec tsx scripts/build-site.ts site
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm dlx wrangler@4.154.0 pages deploy site
          --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          --branch=main
          --commit-hash=${{ github.sha }}
