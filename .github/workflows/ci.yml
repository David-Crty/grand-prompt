name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests with coverage (>= 90% enforced)
        run: pnpm coverage
      - name: Determinism (two processes, same hashes)
        run: pnpm determinism
      - name: Viewer build
        run: pnpm --filter @bench/viewer build
